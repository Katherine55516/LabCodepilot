<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>获取登录态</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <div class="bar">
    <div class="left">
      <svg class="lock" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span class="title">CodePilot 正在捕获登录态</span>
      <span id="target" class="target"></span>
      <span id="error" class="error" role="alert" hidden></span>
    </div>
    <div class="right">
      <button id="finish-btn" class="btn finish" type="button">登录完成</button>
      <button id="cancel-btn" class="btn cancel" type="button">取消</button>
    </div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
